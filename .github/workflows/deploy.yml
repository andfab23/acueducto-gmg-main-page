name: Deploy Angular App to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: ACUEDUCTO_GMG_MAIN_PAGE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        working-directory: ./
        run: npm install

      - name: Compilar aplicación Angular
        working-directory: ./
        run: npm run build -- --configuration=production

      - name: Copiar archivos al VPS vía SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/acueducto-gmg-main/browser/**'
          target: '/var/www/acueducto-gmg-main-page-app'
          strip_components: 3
